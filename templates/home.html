<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Yellow Select Field Styling */
        select.yellow-select {
            background-color: #facc15 !important;
            color: #000 !important;
            border: 2px solid #fbbf24 !important;
            font-weight: 600;
        }

        select.yellow-select option {
            background-color: #facc15 !important;
            color: #000 !important;
        }

        /* Smooth fade-ins */
        .fade-in {
            opacity: 0;
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Slide-in animation */
        .slide-up {
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 0.8s ease-out forwards;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glass effect */
        .glass {
            background: rgba(17, 25, 40, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Button hover */
        .btn-anim:hover {
            transform: scale(1.05);
            transition: 0.2s ease-in-out;
        }

        /* 3D Canvas */
        #bg3d {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }
    </style>
</head>

<body class="text-white min-h-screen">

    <!-- THREE JS BACKGROUND -->
    <canvas id="bg3d"></canvas>

    <!-- HEADER -->
    <div class="text-center pt-10 pb-6 fade-in">
        <div
            class="mx-auto w-16 h-16 rounded-xl bg-yellow-500 bg-opacity-20 flex items-center justify-center shadow-lg animate-pulse">
            🎓
        </div>

        <h1
            class="text-4xl font-semibold bg-gradient-to-r from-yellow-300 via-orange-300 to-red-300 bg-clip-text text-transparent mt-4 slide-up">
            Student Performance Predictor
        </h1>
        <p class="text-gray-300 mt-2 slide-up" style="animation-delay:0.2s">
            Predict your performance using AI
        </p>
    </div>

    <!-- FORM CONTAINER -->
    <div class="max-w-3xl mx-auto mt-6 p-8 rounded-2xl glass shadow-2xl slide-up" style="animation-delay:0.4s">

        <!-- PROGRESS BAR -->
        <p class="text-gray-300 mb-2">Step <span id="step-num">1</span> of 3</p>
        <div class="w-full h-2 bg-gray-700 rounded-full mb-6">
            <div id="progress" class="h-full bg-yellow-400 rounded-full w-1/3 transition-all duration-500"></div>
        </div>

        <!-- STEP 1 -->
        <div id="step1" class="step">
            <h2 class="text-xl font-bold">Personal Information</h2>

            <label class="block mt-4">Gender</label>
            <select id="gender" class="w-full p-3 rounded-lg yellow-select">
                <option>Select gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <label class="block mt-4">Race / Ethnicity</label>
            <select id="ethnicity" class="w-full p-3 rounded-lg yellow-select">
                <option>Select race/ethnicity</option>
                <option>Group A</option>
                <option>Group B</option>
                <option>Group C</option>
                <option>Group D</option>
                <option>Group E</option>
            </select>

            <button onclick="nextStep()" class="mt-6 bg-yellow-500 px-6 py-3 rounded-xl float-right btn-anim shadow-lg">
                Next →
            </button>
        </div>

        <!-- STEP 2 -->
        <div id="step2" class="step hidden">
            <h2 class="text-xl font-bold">Background Information</h2>

            <label class="block mt-4">Parental Level of Education</label>
            <select id="parental" class="w-full p-3 rounded-lg yellow-select">
                <option>Select education level</option>
                <option>Associate's Degree</option>
                <option>Bachelor's Degree</option>
                <option>High School</option>
                <option>Some College</option>
                <option>Master's Degree</option>
            </select>

            <label class="block mt-4">Lunch Type</label>
            <select id="lunch" class="w-full p-3 rounded-lg yellow-select">
                <option>Select lunch type</option>
                <option>Standard</option>
                <option>Free/Reduced</option>
            </select>

            <label class="block mt-4">Test Preparation</label>
            <select id="testprep" class="w-full p-3 rounded-lg yellow-select">
                <option>Select status</option>
                <option>Completed</option>
                <option>None</option>
            </select>

            <button onclick="prevStep()" class="mt-6 bg-gray-600 px-6 py-3 rounded-xl btn-anim">
                ← Back
            </button>
            <button onclick="nextStep()"
                class="mt-6 bg-yellow-500 px-6 py-3 rounded-xl float-right btn-anim shadow-lg">
                Next →
            </button>
        </div>

        <!-- STEP 3 -->
        <div id="step3" class="step hidden">
            <form action="/predictdata" method="POST">

                <h2 class="text-xl font-bold">Test Scores</h2>

                <input type="hidden" name="gender" id="hidden_gender">
                <input type="hidden" name="ethnicity" id="hidden_ethnicity">
                <input type="hidden" name="parental_level_of_education" id="hidden_parental">
                <input type="hidden" name="lunch" id="hidden_lunch">
                <input type="hidden" name="test_preparation_course" id="hidden_testprep">

                <label class="block mt-4">Reading Score</label>
                <input name="reading_score" id="reading" type="number"
                    class="w-full p-3 rounded-lg bg-gray-800" placeholder="Enter reading score" required>

                <label class="block mt-4">Writing Score</label>
                <input name="writing_score" id="writing" type="number"
                    class="w-full p-3 rounded-lg bg-gray-800" placeholder="Enter writing score" required>

                <button onclick="prevStep(); return false;" class="mt-6 bg-gray-600 px-6 py-3 rounded-xl btn-anim">
                    ← Back
                </button>

                <button type="submit"
                    class="mt-6 bg-orange-500 px-6 py-3 rounded-xl float-right btn-anim shadow-lg">
                    Get Prediction →
                </button>

            </form>
        </div>

    </div>

    <!-- RESULT SECTION -->
    {% if results %}
    <div class="max-w-2xl mx-auto mt-10 p-8 rounded-2xl glass shadow-2xl text-center fade-in">
        <h2 class="text-3xl font-bold text-yellow-300">Predicted Math Score</h2>

        <p class="text-6xl font-extrabold text-orange-400 mt-4 animate-pulse">
            {{ results }}
        </p>

        <p class="text-gray-300 mt-4 text-lg">
            Prediction generated successfully.
        </p>
    </div>
    {% endif %}

    <!-- MULTI STEP SCRIPT -->
    <script>
        let step = 1;

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.add('hidden'));
            document.getElementById("step" + n).classList.remove('hidden');
            document.getElementById("step-num").innerText = n;
            document.getElementById("progress").style.width = {
                1: "33%", 2: "67%", 3: "100%"
            }[n];
        }

        function nextStep() {
            if (step === 1) {
                hidden_gender.value = gender.value;
                hidden_ethnicity.value = ethnicity.value;
            }
            if (step === 2) {
                hidden_parental.value = parental.value;
                hidden_lunch.value = lunch.value;
                hidden_testprep.value = testprep.value;
            }
            if (step < 3) step++;
            showStep(step);
        }

        function prevStep() {
            if (step > 1) step--;
            showStep(step);
        }
    </script>

    <!-- THREE JS BACKGROUND -->
    <script>
        const canvas = document.getElementById("bg3d");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 3000;
        const starArray = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i++) {
            starArray[i] = (Math.random() - 0.5) * 2000;
        }

        starsGeometry.setAttribute("position", new THREE.BufferAttribute(starArray, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1 });
        const starField = new THREE.Points(starsGeometry, starsMaterial);

        scene.add(starField);

        camera.position.z = 500;

        function animate() {
            requestAnimationFrame(animate);
            starField.rotation.y += 0.0004;
            renderer.render(scene, camera);
        }
        animate();
    </script>

</body>

</html>
